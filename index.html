<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechConf 2026 Registration</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  
  <header class="header">
    <p class="logo">TechConf 2026</p>
    <nav class="nav">
      <a class="link" href="#">Home</a>
      <a class="link" href="#">Speakers</a>
      <a class="link" href="#">Tickets</a>
    </nav>
  </header>

  <main class="content" aria-hidden="false">
    <h1 class="title">Join the biggest tech event of the year!</h1>
    
    <img alt="Audience at conference" src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800" class="hero-image">

    <form class="form-container">
      <h2 class="form-title">Register Now</h2>
      
      <label for="name">Full Name:</label>
      <input type="text" id="name" placeholder="John Doe">

      <label for="email">Email Address:</label>
      <input type="text" id="email" placeholder="john@example.com">
      
      <div role="combobox" tabindex="0" aria-haspopup="listbox" aria-expanded="false" class="dropdown-trigger" id="ticketType">Select Ticket Type ▾</div>
      <div role="listbox" class="dropdown-menu" id="ticketMenu">
        <div role="option" tabindex="-1" class="dropdown-item" aria-selected="false">Standard ($99)</div>
        <div role="option" tabindex="-1" class="dropdown-item" aria-selected="false">VIP ($299)</div>
      </div>

      <button class="submit-btn" id="submitBtn">Complete Registration</button>
    </form>
  </main>

  <!-- Modal missing ARIA roles and focus trapping -->
  <div class="modal-overlay" id="successModal" aria-labelledby="modal-title-id" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-title" id="modal-title-id">Success!</div>
      <div>Your registration is complete. Please check your email.</div>
      <button class="close-btn" id="closeBtn" type="button">Close Window</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
